# config/patchcore_config.yaml - Optimized for Normal-Only Training

model:
  name: patchcore
  backbone: wide_resnet50_2
  pre_trained: true
  layers:
    - layer2
    - layer3
  coreset_sampling_ratio: 0.1
  num_neighbors: 9

dataset:
  name: folder
  format: folder

  # Root path for training data
  root: ./data

  # Directory names
  normal_dir: good        # Contains normal/good samples
  abnormal_dir: defective # Not used during training, only for testing

  task: segmentation
  image_size: [512, 512]  # Higher resolution for better defect detection
  center_crop: null
  normalization: imagenet
  
  # File extensions to include
  extensions: [".jpg", ".jpeg", ".png", ".bmp"]

dataloader:
  train_batch_size: 8
  eval_batch_size: 8
  num_workers: 4

trainer:
  accelerator: auto
  devices: 1
  default_root_dir: ./models/saved_models
  max_epochs: 1  # PatchCore only needs 1 epoch
  logger: true
  log_every_n_steps: 10
  val_check_interval: 1.0
  enable_progress_bar: true

metrics:
  image:
    - F1Score
    - AUROC
  pixel:
    - F1Score
    - AUROC
  threshold:
    method: adaptive

optimization:
  export_mode: torch

logging:
  logger:
    - class_path: lightning.pytorch.loggers.TensorBoardLogger
      init_args:
        save_dir: logs/tensorboard
        name: patchcore_experiment

tiling:
  apply: true
  tile_size: [512, 512]  # Match image_size
  stride: [256, 256]  # 50% overlap
  remove_border_count: 0
  mode: padding

deployment:
  device: cpu
  precision: 32
  optimize_for_mobile: true
  quantization: false