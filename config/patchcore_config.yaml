# config/patchcore_config.yaml
model:
  name: patchcore
  backbone: wide_resnet50_2
  pre_trained: true
  layers:
    - layer2
    - layer3
  coreset_sampling_ratio: 0.1
  num_neighbors: 9

dataset:
  name: folder
  format: folder
  path: ./data
  normal_dir: good
  abnormal_dir: defective
  task: segmentation
  image_size: [1024, 1024]  # High resolution training
  center_crop: null
  normalization: imagenet
  
dataloader:
  train_batch_size: 8
  eval_batch_size: 8
  num_workers: 4
  
trainer:
  accelerator: auto
  devices: 1
  default_root_dir: ./models/saved_models
  max_epochs: 1  # PatchCore is non-parametric, only needs 1 epoch
  logger: true
  log_every_n_steps: 10
  val_check_interval: 1.0
  
metrics:
  image:
    - F1Score
    - AUROC
  pixel:
    - F1Score
    - AUROC
  threshold:
    method: adaptive
    
optimization:
  export_mode: torch
  
logging:
  logger:
    - class_path: lightning.pytorch.loggers.TensorBoardLogger
      init_args:
        save_dir: logs/tensorboard
        name: patchcore_experiment
        
# Tiling configuration for high-resolution inference
tiling:
  apply: true
  tile_size: [256, 256]
  stride: [128, 128]  # 50% overlap
  remove_border_count: 0
  mode: padding
  
# Deployment specific settings
deployment:
  device: cpu  # Raspberry Pi will use CPU
  precision: 32
  optimize_for_mobile: true
  quantization: false  # Can enable for faster inference on Pi